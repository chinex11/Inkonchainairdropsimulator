name: Live test
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/live.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
